<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<title>Countdown Style Words</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  margin: 0;
  padding: 0;
  width: 100%;
  display: flex;
  justify-content: center;
}
.outer-container {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 20px;
}
.word-grid {
  display: grid;
  grid-template-columns: repeat(2, max-content);
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
}
.board-frame {
  background: #0a2a6a;
  padding: 10px;
  border-radius: 8px;
  box-shadow: 0 0 16px rgba(0,0,0,0.6);
  width: max-content;
}
.letter-row {
  display: grid;
  grid-template-columns: repeat(9, 48px);
  gap: 5px;
}
.tile {
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1e4db7;
  color: white;
  font-size: 1.6rem;
  font-weight: bold;
  border-radius: 6px;
  text-transform: uppercase;
  box-shadow: inset 0 3px 6px rgba(0,0,0,0.4), 0 4px 10px rgba(0,0,0,0.5);
  border: 2px solid #0a2a6a;
}
</style>
</head>
<body>
<div class='outer-container'>
<h1 style='text-align:center;margin:10px 0 20px 0;'>Countdown‑Style Nine‑Letter Draw</h1>
<div class='word-grid' id='wordGrid'></div>
<button onclick='render()' style='margin-top:20px;padding:10px 20px;border-radius:6px;border:none;background:#38bdf8;font-size:1rem;cursor:pointer;'>New Selection</button>
</div>
<script>
let WORDS = [];

// Function to fetch and load the word list from the text file
async function loadWordList() {
    try {
        const response = await fetch('nine_letter_words.txt');
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        const text = await response.text();
        
        // Split the text file by lines, trim whitespace, and ignore empty rows
        WORDS = text.split('\n')
                    .map(word => word.trim().toLowerCase())
                    .filter(word => word.length > 0);

        console.log(`Loaded ${WORDS.length} words successfully.`);
        
        // Start your game or initialization logic here once words are ready
        initGame();
        
    } catch (error) {
        console.error('Could not load the word list:', error);
    }
}

// Call the function when the script runs
loadWordList();
const NUM = 9;
function render() {
  const pool = [...WORDS];
  const chosen = [];
  for (let i = 0; i < NUM; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    chosen.push(pool.splice(idx, 1)[0]);
  }
  const container = document.getElementById('wordGrid');
  container.innerHTML = '';
  chosen.forEach(word => {
    const frame = document.createElement('div');
    frame.className = 'board-frame';
    const row = document.createElement('div');
    row.className = 'letter-row';
    word.split('').forEach(letter => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.textContent = letter;
      row.appendChild(tile);
    });
    frame.appendChild(row);
    container.appendChild(frame);
  });
}
render();
</script>
</body>
</html>
